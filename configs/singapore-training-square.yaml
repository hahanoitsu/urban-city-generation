project:
  city_id: singapore-central
  source_name: OpenStreetMap contributors via BBBike extract
  source_license: ODbL-1.0
  source_snapshot: null

input:
  pbf_path: data/raw/Singapore.osm.pbf
  bbox_wgs84: [103.7900, 1.2900, 103.8700, 1.3700]
  metric_crs: auto
  extraction_backend: gdal
  pyrosm_engine: out_of_core
  pyrosm_workers: auto
  keep_metadata: false
  complete_relations: true

output:
  root: data/processed/singapore-training/singapore-central
  overwrite: false
  save_extracted_gpkg: true
  save_tile_vectors: false

raster:
  tile_size_m: 1024
  pixels: 256
  stride_m: 1024
  all_touched: true
  max_height_m: 180
  include_partial_tiles: false

roads:
  widths_m:
    major: 8.0
    secondary: 6.5
    local: 5.0
  lane_width_m: 3.25
  edge_margin_m: 0.8
  minimum_width_m: 2.5
  maximum_width_m: 24.0
  surface_all_touched: false

heights:
  floor_height_m: 3.1
  default_height_m: 9.3
  default_by_building:
    apartments: 24.8
    residential: 9.3
    house: 7.0
    commercial: 15.5
    retail: 9.3
    industrial: 10.0
    school: 12.4
    hospital: 18.6

# The study area is chosen manually. These checks only remove unusable samples.
quality:
  minimum_buildings: 0
  minimum_road_length_m: 0
  minimum_nonempty_fraction: 0.001
  minimum_valid_fraction: 0.95
  reject_water_fraction_above: 0.95
