data:
  task: block
  train_manifest: data/manifests/singapore-corpus/train.jsonl
  validation_manifest: data/manifests/singapore-corpus/validation.jsonl
  resolution: [128, 128]
  crop_size_pixels: 128
  crop_stride_pixels: 32
  augment: true

model:
  block_out_channels: [64, 128, 256]
  layers_per_block: 2
  attention_levels: [false, false, true]
  norm_num_groups: 8

diffusion:
  train_steps: 1000
  inference_steps: 100
  beta_schedule: squaredcos_cap_v2

run:
  output_dir: runs/semantic-block
  epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  seed: 5132
  device: auto
  ema_decay: 0.999
  gradient_clip_norm: 1.0
  checkpoint_every: 10
  preview_every: 10
  early_stopping_patience: 20
