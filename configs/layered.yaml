data:
  train_manifest: data/manifests/corpus/train.jsonl
  validation_manifest: data/manifests/corpus/validation.jsonl
  resolution: [128, 128]
  crop_size_pixels: 128
  crop_stride_pixels: 32
  augment: true
  vertical_crop_repeat: 4

model:
  block_out_channels: [64, 128, 256, 256]
  layers_per_block: 2
  attention_levels: [false, false, false, true]
  norm_num_groups: 8

diffusion:
  train_steps: 1000
  inference_steps: 100
  beta_schedule: squaredcos_cap_v2

run:
  output_dir: runs/layered
  epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 8
  pin_memory: true
  precision: bf16
  seed: 5132
  device: cuda
  ema_decay: 0.999
  gradient_clip_norm: 1.0
  checkpoint_every: 5
  preview_every: 5
  early_stopping_patience: 25
  channel_loss_weights: [1.0, 1.0, 1.0, 1.2, 1.2, 1.2, 1.3, 1.0, 2.0, 2.0, 2.5, 2.5, 0.7]

vector:
  max_height_m: 180
  minimum_component_pixels: 3
