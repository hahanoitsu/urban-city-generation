project:
  city_id: singapore
  source_name: OpenStreetMap contributors via BBBike extract
  source_license: ODbL-1.0
  source_snapshot: null

input:
  pbf_path: data/raw/Singapore.osm.pbf
  bbox_wgs84: [103.60, 1.15, 104.10, 1.50]
  metric_crs: auto
  extraction_backend: gdal
  pyrosm_engine: out_of_core
  pyrosm_workers: auto
  keep_metadata: false
  complete_relations: true

output:
  root: data/cities
  gpkg_path: data/cities/singapore.gpkg
  overwrite: false
  save_extracted_gpkg: false
  save_tile_vectors: false

raster:
  tile_size_m: 1024
  pixels: 256
  stride_m: 1024

roads:
  widths_m:
    major: 8.0
    secondary: 6.5
    local: 5.0
  lane_width_m: 3.25
  edge_margin_m: 0.8
  minimum_width_m: 2.5
  maximum_width_m: 24.0
  surface_all_touched: false

heights:
  floor_height_m: 3.1
  default_height_m: 9.3
  default_by_building:
    apartments: 24.8
    residential: 9.3
    house: 7.0
    commercial: 15.5
    retail: 9.3
    industrial: 10.0
    school: 12.4
    hospital: 18.6

vertical_profiles:
  road_default_elevated_m: 7.0
  rail_default_elevated_m: 8.0
  road_default_tunnel_depth_m: 8.0
  rail_default_tunnel_depth_m: 14.0
  layer_step_m: 5.0
  deck_thickness_m: 1.0
  embankment_offset_m: 3.0
  cutting_depth_m: 3.0
  road_max_grade: 0.08
  rail_max_grade: 0.035
  sample_step_m: 2.0

quality:
  minimum_buildings: 0
  minimum_road_length_m: 0
