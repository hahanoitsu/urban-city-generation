[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-city-generation"
version = "0.8.0"
description = "JSON-first generative urban graphs and 3D city compilation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Suvigya Goyal"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "rasterio>=1.4",
  "Pillow>=11",
  "PyYAML>=6",
  "networkx>=3.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
osm = ["pyrosm>=0.11.0"]
ml = ["torch>=2.7"]
dev = ["pytest>=8", "ruff>=0.9"]
all = ["pyrosm>=0.11.0", "torch>=2.7", "pytest>=8", "ruff>=0.9"]

[project.scripts]
urban-dataset = "urban_dataset.__main__:main"
urban-ai = "urban_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
