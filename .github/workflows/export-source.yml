name: export-source

on:
  push:
    branches: [tmp-export-seeded-extension]
    paths: [.export-ready]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write temporary source chunks
        run: |
          rm -rf .export
          mkdir .export
          tar --exclude=.git --exclude=.github/workflows/export-source.yml --exclude=.export-ready --exclude=.export -czf /tmp/source.tar.gz .
          base64 -w 0 /tmp/source.tar.gz | split -b 3000 - .export/chunk-
          git config user.name "Suvigya Goyal"
          git config user.email "105093069+hahanoitsu@users.noreply.github.com"
          git add -A .export
          git commit -m "Rewrite temporary source export"
          git push origin HEAD:tmp-export-seeded-extension
